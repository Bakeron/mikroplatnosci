<!doctype html>
<html lang="pl" data-motyw="ciemny">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' ws://127.0.0.1:* ws://localhost:* https:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Mikropłatności</title>
  <link rel="stylesheet" href="/css/wyglad.css">
</head>
<body>
  <header class="naglowek">
    <h1>Mikropłatności</h1>
    <p class="naglowek__data" id="dzisiaj"></p>
    <p class="kursy" id="kursy" aria-live="polite"></p>
    <button type="button" class="motyw" id="motyw" title="Przełącz tło: ciemne / jasne"><span class="motyw__noc">noc</span><span class="motyw__dzien">dzień</span></button>
    <span class="status" id="status" aria-live="polite"></span>
  </header>

  <div class="blad" id="blad" hidden></div>

  <main class="kartka">
    <table class="zeszyt">
      <thead>
        <tr>
          <th class="kol-lp" title="Kolejność - przeciągnij numer, aby przesunąć wiersz">Lp.</th>
          <th class="kol-akcje"><span class="sr">Wykreśl</span></th>
          <th>Nazwa i opis<span class="naglowek-opis"><span class="wykrzyknik" aria-hidden="true">!</span> = jednorazowa, do wycofania</span></th>
          <th class="kol-koszt">Koszt</th>
          <th class="kol-koszt kol-prognoza" title="Cena na najbliższy miesiąc - wpisana ręcznie albo, za zgodą, odczytana ze strony z linku">Prognoza<span class="naglowek-opis">☑ = cena ze strony</span></th>
          <th class="kol-zakup" title="Data zakupu i okres płatności: miesięczna albo roczna">Zakup</th>
          <th class="kol-termin">Do płatności</th>
          <th class="kol-przedluzac">Przedłużać</th>
          <th class="kol-link">Link</th>
        </tr>
      </thead>
      <tbody id="wiersze"></tbody>
      <tfoot>
        <tr class="dopisz-wiersz">
          <td colspan="9"><button type="button" class="dopisz" id="dodaj">+ dopisz nową pozycję…</button></td>
        </tr>
      </tfoot>
    </table>
    <p class="pusto" id="pusto" hidden>Zeszyt jest pusty - dopisz pierwszą pozycję.</p>

    <section class="margines" aria-label="Najbliższe terminy i podsumowanie">
      <div class="miarka-ramka">
        <h2 class="tytul-sekcji">Najbliższe 3 miesiące</h2>
        <div class="miarka" id="miarka"></div>
      </div>

      <div class="margines__dol">
        <div class="spisy">
          <h2 class="tytul-sekcji">Roczne - zbliża się płatność</h2>
          <ul class="spis" id="alarmy-roczne"></ul>
          <h2 class="tytul-sekcji"><span class="wykrzyknik" aria-hidden="true">!</span> Do wycofania przed odnowieniem</h2>
          <ul class="spis spis--wycofanie" id="alarmy-jednorazowe"></ul>
        </div>
        <aside class="paragon-cien"><div class="paragon" id="podsumowanie" aria-label="Podsumowanie kosztów"></div></aside>
      </div>
    </section>
  </main>

  <dialog class="okno" id="okno-usun">
    <p id="okno-usun-tekst"></p>
    <div class="okno__przyciski">
      <button type="button" class="przycisk-tekst" id="okno-anuluj">Zostaw</button>
      <button type="button" class="pieczatka" id="okno-potwierdz">Wykreśl</button>
    </div>
  </dialog>

  <script src="/js/neutralino.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
