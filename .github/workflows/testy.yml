# Unit tests of the shared calculation modules (pc/testy) on every push and pull request.
name: Testy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Warsaw
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: npm test
        working-directory: pc
        run: npm test
